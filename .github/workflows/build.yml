name: Build APK

# 触发方式：推送到 main / master 时自动构建，或在 Actions 页手动 Run workflow。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 云端编译 release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      # 上传时若把“健康食谱”文件夹整个拖入，会多一层目录。
      # 这一步把项目目录统一成 app，避免中文路径带来的问题。
      - name: 2. 统一项目目录
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "项目已在根目录"
          elif [ -d "健康食谱" ]; then
            mv "健康食谱" app
          else
            echo "找不到 pubspec.yaml，请检查上传内容"; exit 1
          fi

      - name: 3. 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 5. 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/**/*.gradle', 'app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 6. 准备 Gradle Wrapper
        working-directory: app
        run: |
          flutter create --platforms=android --no-pub \
            --project-name tmpwrap --org com.healthrecipe /tmp/tmpwrap
          cp /tmp/tmpwrap/android/gradlew android/gradlew
          cp /tmp/tmpwrap/android/gradlew.bat android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp /tmp/tmpwrap/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: 7. 获取项目依赖
        working-directory: app
        run: flutter pub get

      - name: 8. 代码检查（不阻塞构建）
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 9. 构建 release APK
        working-directory: app
        run: flutter build apk --release

      - name: 10. 上传 APK 作为可下载文件
        uses: actions/upload-artifact@v4
        with:
          name: healthy-recipe-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
